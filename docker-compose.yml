
version: '3.8'

services:
  web:
    build: .
    container_name: kova_app
    restart: always

    expose:
      - "5000"

    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}

      - KOVA_SECRET_KEY=${KOVA_SECRET_KEY}
      - KOVA_HTTPS=${KOVA_HTTPS:-false}
      - KOVA_TRUST_PROXY=${KOVA_TRUST_PROXY:-false}
      - KOVA_ALLOWED_ORIGIN=${KOVA_ALLOWED_ORIGIN:-}

    volumes:
      - kova_perfiles:/app/static/uploads/perfiles

    networks:
      - kova-network

networks:
  kova-network:
    driver: bridge

volumes:
  kova_perfiles:
